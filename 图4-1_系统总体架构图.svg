ly="Microsoft YaHei" font-size="8.40" text-anchor="middle" fill="#000000">MyBatis-Plus 3.5.5</text><text x="148.49999999999997" y="76.46733333333334" font-family="Microsoft YaHei" font-size="8.40" text-anchor="middle" fill="#000000">Mapper 映射</text><rect x="192.66666666666666" y="64.5" width="80.33333333333333" height="17.5" fill="#FFFFFF" stroke="#000000" stroke-width="0.4941999999999999"/><text x="232.83333333333331" y="71.64133333333334" font-family="Microsoft YaHei" font-size="8.40" text-anchor="middle" fill="#000000">Python 爬虫</text><text x="232.83333333333331" y="76.46733333333334" font-family="Microsoft YaHei" font-size="8.40" text-anchor="middle" fill="#000000">景点与社区数据</text><line x1="43.083333333333336" y1="122" x2="43.083333333333336" y2="86" stroke="#000" stroke-width="0.5648"/><line x1="127.41666666666666" y1="122" x2="127.41666666666666" y2="86" stroke="#000" stroke-width="0.5648"/><line x1="211.75" y1="122" x2="211.75" y2="86" stroke="#000" stroke-width="0.5648"/><line x1="43.083333333333336" y1="88" x2="43.083333333333336" y2="54" stroke="#000" stroke-width="0.5648"/><line x1="127.41666666666666" y1="88" x2="127.41666666666666" y2="54" stroke="#000" stroke-width="0.5648"/><line x1="211.75" y1="88" x2="211.75" y2="54" stroke="#000" stroke-width="0.5648"/><text x="80.14" y="123.89850000000001" font-family="Microsoft YaHei" font-size="7.44" text-anchor="start" fill="#000000" stroke="#FFFFFF" stroke-width="2.4" paint-order="stroke">HTTP / JSON（RESTful 接口）</text><text x="80.14" y="89.89850000000001" font-family="Microsoft YaHei" font-size="7.44" text-anchor="start" fill="#000000" stroke="#FFFFFF" stroke-width="2.4" paint-order="stroke">JDBC / MyBatis-Plus</text><text x="21.599999999999998" y="30.817333333333334" font-family="Microsoft YaHei" font-size="8.40" text-anchor="start" fill="#000000">说明：前端采用多页面应用（MPA）方式组织，页面之间以原生 JavaScript 跳转，未使用 Vue Router；表现层通过 Axios 以 JSON 格式调用后端 RESTful 接口；后端按控制层、业务层、数据访问</text><text x="21.599999999999998" y="35.6433333333333