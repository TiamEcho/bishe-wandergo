<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行社区 · WANDERGO</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<section class="sec page-hero"><div class="wrap">
  <div class="kick">COMMUNITY</div>
  <h2>旅行社区 · 真实旅行者的攻略</h2>
  <p>打卡视频带 BGM，Plog 图文故事 —— 每一条真实打卡，都会成为其他人的攻略。支持按人群 / 平台筛选，热度榜与人群适配图表一键查看。</p>
</div></section>

<section class="sec" style="padding-top:6px"><div class="wrap">
  <div class="filter-tabs" id="feedTabs">
    <button class="on" data-f="all">全部</button><button data-f="cn">🇨🇳 国内</button><button data-f="ab">🌍 国外</button><button data-f="video">🎬 打卡视频</button><button data-f="plog">📷 Plog</button>
  </div>
  <div class="filter-tabs plat-tabs" id="platTabs">
    <button class="on" data-p="all">🌐 全部平台</button><button data-p="douyin">🎵 抖音</button><button data-p="xhs">📕 小红书</button><button data-p="kuaishou">⚡ 快手</button><button data-p="ins">📸 Instagram</button><button data-p="yt">▶️ YouTube</button>
  </div>
  <div class="blk-head"><h4>✨ 精选 4K 摄影</h4><span class="blk-sub">TOP 级画质 · 点击查看大图</span></div>
  <div class="feat-strip" id="featStrip"></div>
  <div class="blk-head"><h4>🔥 话题热度榜</h4><div class="sorter"><button class="mini on" data-s="heat">按热度</button><button class="mini" data-s="up">按涨幅</button><span class="blk-sub">点击话题进入话题社区</span></div></div>
  <div class="heat-list" id="heatList"></div>
  <div class="feed-grid" id="feedGrid"></div>
  <p class="src-note" style="margin-top:16px">📊 声明：本区内容聚合自抖音 / 小红书 / 快手 / Instagram / YouTube 等平台的创作者内容与站内用户真实打卡数据；热度榜单与人群适配图表由 AI 爬虫对全网数据抓取、清洗后加权整理生成，仅供参考。</p>
</div></section>

<script src="js/data.js?v=1107"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="js/api.js?v=1107"></script>
<script src="js/core.js?v=1107"></script>
<script src="js/community.js?v=1107"></script>
</body>
</html>
