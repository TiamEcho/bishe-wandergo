<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 旅行规划 · WANDERGO</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<section class="sec page-hero"><div class="wrap">
  <div class="kick">AI TRAVEL PLANNER</div>
  <h2>AI 智能规划 · 模块化输出</h2>
</div></section>

<section class="sec" style="padding-top:6px"><div class="wrap">
  <div class="ai-hero-box">
    <div class="ai-title"><span class="spark">✦</span>AI 旅行规划师 · Fly Me Intelligence</div>
    <p class="ai-sub">示例：「我想去大理玩 3 天，预算 3000，喜欢湖景和慢生活」</p>
    <div class="ai-input">
      <input id="aiInput" placeholder="告诉我你的目的地、天数和预算，AI 为你生成模块化攻略…">
      <button class="btn gold" id="aiGo" style="height:46px;padding:0 26px">✨ 生成规划</button>
    </div>
    <div class="ai-chips" id="aiChips">
      <button>我想去大理玩 3 天，预算 3000</button>
      <button>成都九寨沟 4 日亲子游</button>
      <button>新疆喀纳斯 6 天环线</button>
      <button>西藏拉萨 5 天朝圣之旅</button>
      <button>内蒙古呼伦贝尔草原 5 天</button>
      <button>常州恐龙园 2 天亲子游</button>
      <button>日本红叶季 6 天怎么玩</button>
      <button>冰岛极光环岛自驾</button>
      <button>长沙 3 天美食之旅</button>
      <button>青岛 3 天看海</button>
    </div>
    <div class="pipeline" id="pipeline">
      <div class="steps">
        <div class="step" data-s="0"><span class="ico">🔍</span>理解你的问题</div>
        <div class="step" data-s="1"><span class="ico">🕷</span>爬虫抓取全网攻略</div>
        <div class="step" data-s="2"><span class="ico">📊</span>数据清洗与分析</div>
        <div class="step" data-s="3"><span class="ico">🧩</span>模块化方案生成</div>
      </div>
      <div class="pipe-bar"><i id="pipeBar"></i></div>
      <div class="pipe-tip" id="pipeTip">AI 正在思考…</div>
    </div>
    <div class="plan-head" id="planHead"></div>
    <aside class="mod-rail" id="modRail">
      <button class="rail-toggle" id="railToggle" title="展开 / 收起模块导航">🧩<span>模块</span></button>
      <div class="rail-list" id="railList"></div>
    </aside>
    <div class="mod-grid" id="modGrid"></div>
  </div>
</div></section>

<script src="js/data.js?v=1120"></script>
<script src="js/poi_route.js?v=1120"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="js/api.js?v=1120"></script>
<script src="js/core.js?v=1120"></script>
<script src="js/map.js?v=1120"></script>
<script src="js/ai.js?v=1120"></script>
<script>
/* 深度链接：ai.html?dest=大理 自动生成方案 */
const _dest=WGO.q('dest');
if(_dest){$('#aiInput').value='我想去'+_dest+'玩，帮我做一份模块化攻略';setTimeout(()=>runAI($('#aiInput').value),700)}
</script>
</body>
</html>
