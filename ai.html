<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 旅行规划 · WANDERGO</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<section class="sec page-hero"><div class="wrap">
  <div class="kick">AI TRAVEL PLANNER</div>
  <h2>AI 智能规划 · 模块化输出</h2>
</div></section>

<section class="sec" style="padding-top:6px"><div class="wrap">
  <div class="ai-hero-box">
    <div class="ai-form" id="aiForm">
      <div class="ai-form-title"><span class="spark">✦</span>AI 旅行规划师 · Fly Me Intelligence</div>
      <p class="ai-sub">填写以下信息，AI 将为你量身定制一份模块化旅行攻略</p>

      <div class="ai-block">
        <div class="ai-block-head"><span class="ai-num">01</span>目的地与日期</div>
        <div class="ai-row">
          <div class="ai-field grow">
            <label>* 目的地城市</label>
            <input id="fDest" placeholder="输入城市名称，例如：中国·杭州">
          </div>
          <div class="ai-field">
            <label>* 出发日期</label>
            <input id="fStart" type="date">
          </div>
          <div class="ai-field">
            <label>* 返程日期</label>
            <input id="fEnd" type="date">
          </div>
          <div class="ai-field">
            <label>旅行天数</label>
            <div class="ai-days" id="fDays">1 天</div>
          </div>
        </div>
      </div>

      <div class="ai-block">
        <div class="ai-block-head"><span class="ai-num">02</span>偏好设置</div>
        <div class="ai-row">
          <div class="ai-field grow">
            <label>交通方式</label>
            <select id="fTransport">
              <option>公共交通</option><option>自驾</option><option>飞机</option><option>高铁</option><option>飞机+高铁</option>
            </select>
          </div>
          <div class="ai-field grow">
            <label>住宿风格</label>
            <select id="fStay">
              <option>经济实惠</option><option>舒适型</option><option>豪华型</option><option>特色民宿</option><option>青旅</option>
            </select>
          </div>
        </div>
        <div class="ai-field" style="margin-top:14px">
          <label>旅行兴趣</label>
          <div class="ai-interests" id="fInterests">
            <button type="button">历史文化</button>
            <button type="button">自然风光</button>
            <button type="button">美食</button>
            <button type="button">购物</button>
            <button type="button">艺术</button>
            <button type="button">休闲</button>
          </div>
        </div>
      </div>

      <div class="ai-block">
        <div class="ai-block-head"><span class="ai-num">03</span>特殊需求</div>
        <textarea id="fSpecial" rows="4" placeholder="告诉我你的特殊需求，比如：带老人出行、想看日出、对花粉过敏……"></textarea>
      </div>

      <button class="ai-submit" id="aiGo" type="button">开始规划旅程</button>
    </div>

    <!-- 生成进度条 -->
    <div class="pipeline" id="pipeline">
      <div class="steps">
        <div class="step" data-s="0"><span class="ico">🔍</span>理解你的问题</div>
        <div class="step" data-s="1"><span class="ico">🕷</span>爬虫抓取全网攻略</div>
        <div class="step" data-s="2"><span class="ico">📊</span>数据清洗与分析</div>
        <div class="step" data-s="3"><span class="ico">🧩</span>模块化方案生成</div>
      </div>
      <div class="pipe-bar"><i id="pipeBar"></i></div>
      <div class="pipe-tip" id="pipeTip">AI 正在思考…</div>
    </div>

    <div class="plan-head" id="planHead"></div>
    <div class="itinerary-3col" id="itin3col"></div>
    <aside class="mod-rail" id="modRail">
      <button class="rail-toggle" id="railToggle" title="展开 / 收起模块导航">🧩<span>模块</span></button>
      <div class="rail-list" id="railList"></div>
    </aside>
    <div class="mod-grid" id="modGrid"></div>
  </div>
</div></section>

<script src="js/data.js?v=1120"></script>
<script src="js/poi_route.js?v=1120"></script>
<script src="utils/coordTransform.js?v=1120"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="js/api.js?v=1120"></script>
<script src="js/core.js?v=1120"></script>
<script src="js/map.js?v=1120"></script>
<script src="js/ai.js?v=1120"></script>
<script>
/* 深度链接：ai.html?dest=大理&days=3 自动填充并生成方案 */
const _dest=WGO.q('dest');
if(_dest){
  const fDest=document.getElementById('fDest');
  const _days=parseInt(WGO.q('days')||'0',10);
  if(fDest){
    fDest.value=_dest;
    if(_days>0){
      const today=new Date();
      const end=new Date(today.getTime()+(_days-1)*86400000);
      const fmt=d=>d.toISOString().slice(0,10);
      document.getElementById('fStart').value=fmt(today);
      document.getElementById('fEnd').value=fmt(end);
      calcDays();
    }
    setTimeout(()=>runAI(),700);
  }
}
</script>
</body>
</html>
