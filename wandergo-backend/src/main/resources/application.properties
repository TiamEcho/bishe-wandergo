# ============================================================
# WANDERGO 后端 · 本地 MySQL 配置
# 数据库：wandergo（MySQL 8.0.29 / 127.0.0.1:3306）
# 线上 Render 走 application-postgres.yml（SPRING_PROFILES_ACTIVE=postgres）
# 可用环境变量覆盖：MYSQL_URL / MYSQL_USERNAME / MYSQL_PASSWORD / PORT
# ============================================================
server.port=${PORT:8080}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/wandergo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root1234}

spring.jackson.default-property-inclusion=non_null

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.banner=false

wandergo.jwt.secret=WandergoFlyMeToTheWorld2026GraduationProjectSecretKey
wandergo.jwt.expire-hours=72

# ============================================================
# AI 配置（DeepSeek，OpenAI 兼容协议）
# API Key 读取顺序：
#   ① 环境变量 DEEPSEEK_API_KEY（标准做法，优先级最高）
#   ② 环境变量 PLAN_API_KEY（与 Node 适配层 backend/.env 同名，一键复用同一把 Key）
# 两者都为空时 AI 接口不报错，自动降级为站内规则算法，响应 engine 字段标注 rule
#   PowerShell 启动示例： $env:PLAN_API_KEY="sk-xxx"; java -jar wandergo-backend.jar
# ============================================================
wandergo.ai.base=${DEEPSEEK_API_BASE:${PLAN_API_BASE:https://api.deepseek.com}}
wandergo.ai.model=${DEEPSEEK_MODEL:${PLAN_MODEL:deepseek-chat}}
wandergo.ai.api-key=${DEEPSEEK_API_KEY:${PLAN_API_KEY:}}
wandergo.ai.timeout-ms=${DEEPSEEK_TIMEOUT:30000}
