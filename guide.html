<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模块导览 · WANDERGO</title>
<link rel="stylesheet" href="css/style.css?v=1120">
<link rel="stylesheet" href="css/pages.css?v=1120">
<link rel="stylesheet" href="css/guide.css?v=1120">
</head>
<body>

<section class="sec page-hero"><div class="wrap">
  <div class="kick">MODULE GUIDE</div>
  <h2>模块导览 · 每个功能都有图文介绍</h2>
</div></section>

<section class="sec" style="padding-top:4px"><div class="wrap">
  <div class="gd-bar">
    <input id="gdQ" placeholder="🔍 搜模块或功能：BGM、饼图、词条、协同过滤…">
    <div class="gd-tabs" id="gdTabs">
      <button class="on" data-f="all">全部</button>
      <button data-f="plan">规划</button>
      <button data-f="content">内容</button>
      <button data-f="record">记录</button>
      <button data-f="fun">趣味</button>
    </div>
  </div>
  <div class="gd-empty" id="gdEmpty" style="display:none">没有匹配的模块，换个词试试～</div>
  <nav class="gd-nav" id="gdNav"></nav>
  <div id="gdMain"></div>
</div></section>

<!-- 预览模态框 -->
<div class="gd-modal" id="gdModal">
  <div class="gd-dialog">
    <div class="gd-mhead"><b id="gdModalTitle">功能预览</b><button class="gd-mclose">✕</button></div>
    <div class="gd-mbody" id="gdModalBody"></div>
  </div>
</div>

<script src="js/data.js?v=1120"></script>
<script src="js/core.js?v=1120"></script>
<script>window.WGO_PAGE='guide';</script>
<script src="js/guide.js?v=1120"></script>
</body>
</html>
