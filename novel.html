    <div class="spot-mini" onclick="openSpot('cp')"><img data-img="cp" alt="纽约"><div><h5>《了不起的盖茨比》· 纽约</h5><div class="city">爵士时代的绿灯与长岛夜宴</div><div class="icon-chips"><span class="hl">🍂 中央公园</span><span>🥂 复古摩登</span><button class="more" style="all:unset;cursor:pointer;color:var(--gold);font-size:10.5px" onclick="event.stopPropagation();askAI('纽约')">🤖 AI 规划 →</button></div></div></div>
