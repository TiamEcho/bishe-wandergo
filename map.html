<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环球地图 · WANDERGO</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<section class="sec page-hero"><div class="wrap">
  <div class="kick">EXPLORE THE MAP</div>
  <h2>手帐风地图 · 景点标点 · 你的点亮足迹</h2></div></section>

<section class="sec" style="padding-top:10px"><div class="wrap">
  <div class="map-card">
    <div class="map-top">
      <div class="map-tabs" id="mapTabs">
        <button class="on" data-m="cn">🇨🇳 中国地图</button>
        <button data-m="world">🌍 世界地图 · 环球航线</button>
      </div>
      <div class="map-legend"><span><i class="lg-red"></i>热门打卡地</span><span><i class="lg-gold"></i>✨ 已点亮（我打卡过）</span><span><i class="lg-line"></i>飞行航线</span><span><i class="lg-mt"></i>手绘山脉</span></div>
    </div>
    <div class="map-toolbar">
      <button class="tb" onclick="resetView(cur)">🎯 重置视角</button>
      <button class="tb" onclick="zoomBy(cur,1.35)">🔍＋ 放大</button>
      <button class="tb" onclick="zoomBy(cur,1/1.35)">🔍－ 缩小</button>
      <button class="tb" onclick="toggleLabels(this)">🔤 省份名 开/关</button>
      <span class="lit-chip" id="litChip">✨ 已点亮 0 处</span>
    </div>
    <div id="chinaMap" style="height:560px"></div>
    <div id="worldMap" style="height:560px;display:none"></div>
    <div id="mapFallback" class="map-fallback" style="display:none"></div>
    <div class="route-note">
      <span><i class="rdot" style="background:#ff6b57"></i>红点 = 热门打卡地</span>
      <span><i class="rdot" style="background:#ffd76a"></i>金环 = 已点亮目的地</span>
      <span><i class="rdot" style="background:#7ea6d9"></i>白字 = 省份 / 国家名（点击名字也能飞过去）</span>
      <span>🖱 滚轮缩放 · 点击省份或标点飞过去</span>
    </div>
    <div class="map-note">📍 坐标获取方式：爬虫抓取公开地理数据 + 高德/百度<b>坐标拾取器</b>（lbs.amap.com/tools/picker）校准 · 地图底图来自 ECharts 在线资源 · <b>手帐风平面</b>绘制，小山纹样按真实地形分布</div>
  </div>
</div></section>

<script src="js/data.js?v=1167"></script>
<script src="img/spots/manifest.js"></script>
<script src="geo/manifest.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="js/api.js?v=1162"></script>
<script src="js/core.js?v=1171"></script>
<script src="js/map.js?v=1172"></script>
<script>
let cur=null,labelsOn=true;
const seedKey='fmw_lit_seed';
/* 首次访问点亮 3 处示例足迹（真实打卡会持续增加），可在打卡页删除 */
function ensureSeedLit(){
  if(localStorage.getItem(seedKey))return;
  const albums=JSON.parse(localStorage.getItem('fmw_albums')||'[]');
  const today=new Date().toISOString().slice(0,10);
  [['erhai','大理 · 洱海生态廊道','示例足迹：环海西路骑行 12km，才村码头日出绝了。'],
   ['gugong','北京 · 故宫博物院','示例足迹：六百年紫禁城，红墙黄瓦拍不够。'],
   ['inari','京都 · 伏见稻荷大社','示例足迹：清晨六点的千本鸟居，几乎无人。']].forEach(([id,dest,text],i)=>{
    if(!albums.find(a=>a.dest===spotById(id).n))albums.push({id:'seed'+i,dest,city:spotById(id).city,date:today,text,mood:'😌 治愈放松',costs:[{k:'🎫 门票',v:i*10+20}],total:i*10+20,imgs:[],hasVideo:false});
  });
  localStorage.setItem('fmw_albums',JSON.stringify(albums));
  localStorage.setItem(seedKey,'1');
}
function buildMaps(){
  ensureSeedLit();
  const lit=litSet();
  $('#litChip').textContent='✨ 已点亮 '+lit.size+' 处';
  const opt={spots:SPOTS.filter(s=>s.rg==='cn'),litIds:lit,flights:true,onSpot:openMapSpot};
  /* 两张图分别初始化：世界图失败不能连带中国图一起白屏 */
  cur=createWanderMap('chinaMap','cn',opt);
  /* createWanderMap 在 echarts 尚未就绪时会返回 null，这里再试一次并报错，
     避免画布只剩纸纹背景、地图整块空白 */
  if(!cur&&window.echarts)cur=createWanderMap('chinaMap','cn',opt);
  if(!cur)throw new Error('中国地图初始化失败：echarts 或 china.js 未就绪');
  try{world=createWanderMap('worldMap','world',{spots:SPOTS.filter(s=>s.rg==='ab'),litIds:lit,flights:true,onSpot:openMapSpot})}
  catch(e){console.warn('[map] 世界地图初始化失败',e);world=null}
}
function toggleLabels(btn){
  labelsOn=!labelsOn;
  [cur,world].forEach(c=>{if(!c)return;const o=c.getOption();
    c.setOption({geo:o.geo.map((g,i)=>i===o.geo.length-1?{label:{show:labelsOn}}:g)})});
  toast(labelsOn?'🔤 省份名已显示':'省份名已隐藏');
}
$$('#mapTabs button').forEach(b=>b.onclick=()=>{
  mapMode=b.dataset.m;
  $$('#mapTabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('#chinaMap').style.display=mapMode==='cn'?'block':'none';
  $('#worldMap').style.display=mapMode==='world'?'block':'none';
  const target=mapMode==='cn'?cur:world;
  if(target){requestAnimationFrame(()=>requestAnimationFrame(()=>syncMapGeo(target)))}
});
let world=null;
/* ================= P2 地图标点弹窗 + 图文打卡 =================
 * 点击标点不再直接走 core 的通用景点详情，而是弹出本页专用卡片：
 * 名称 / 评分 / 图片 + 「📸 打卡」按钮，打卡记录走后端 /api/checkin 入库。 */
let MAP_CK_IMGS=[];       /* 已压缩的 dataURL（最多 4 张） */
const CK_MAX=4, CK_W=800, CK_Q=.7;
function mapSpotImg(s){
  /* 只认本地图库；缺图时按类型给分级占位图，避免弹窗顶部一块空白 */
  const u=(typeof localImg==='function'&&localImg(s.id))||'';
  return u||(typeof imgPlaceholderSvg==='function'?imgPlaceholderSvg('spot'):'');
}
function openMapSpot(id){
  const s=spotById(id);if(!s)return;
  MAP_CK_IMGS=[];
  const lit=litSet().has(id);
  const img=mapSpotImg(s);
  openModal(`<button class="mx" onclick="closeModal()">✕</button>
  <div class="mspot-hero"><img class="zoomable" src="${img}" data-key="${s.id}" alt="${s.n}" style="width:100%;height:210px;object-fit:cover;display:block">
    <div class="mspot-hcap"><h3>${s.n}${lit?' <span class="tagpill lit">✨ 已点亮</span>':''}</h3>
      <div class="mspot-meta"><span>⭐ <b>${s.rating}</b></span><span>📍 ${s.city}</span><span>${s.tag}</span></div></div></div>
  <div class="dbody">
    <div class="kv">
      <div class="item">🏠 景点地址<b>${s.addr}</b></div>
      <div class="item">🌐 经纬度坐标<b class="gold">${s.lng.toFixed(3)}, ${s.lat.toFixed(3)}</b></div>
      <div class="item">⏱ 建议游玩时长<b>${s.hrs}</b></div>
      <div class="item">💰 门票参考<b class="gold">${s.price}</b></div>
    </div>
    <div class="mspot-ck" id="mspotCk">
      <div class="mspot-ck-h"><b>📸 在这里打卡</b><span>图文同步到「我的打卡」与后端数据库</span></div>
      <textarea id="ckText" rows="3" placeholder="这一站看到了什么？写两句留着纪念…"></textarea>
      <div class="mspot-ck-btns">
        <label class="ck-upload">＋ 添加图片<input type="file" id="ckFiles" accept="image/*" multiple hidden onchange="onCkPick(this)"></label>
        <div class="ck-pv" id="ckPv"></div>
      </div>
      <div class="mspot-ck-acts">
        <button class="btn line" onclick="openSpot('${s.id}')">查看更多详情</button>
        <button class="btn gold" id="ckSubmit" onclick="submitMapCheckin('${s.id}')">✅ 提交打卡</button>
      </div>
    </div>
  </div>`,true);
  renderCkPv();
}
function renderCkPv(){
  const box=$('#ckPv');if(!box)return;
  box.innerHTML=MAP_CK_IMGS.map((u,i)=>`<div class="ck-th"><img src="${u}" alt="打卡图${i+1}"><span class="x" onclick="delCkImg(${i})">✕</span></div>`).join('');
}
function delCkImg(i){MAP_CK_IMGS.splice(i,1);renderCkPv()}
/* 选图：canvas 压到最长边 800px / JPEG 0.7，控制单条记录的 dataURL 体积（后端 JSON 上限 2MB） */
function onCkPick(input){
  const files=[...(input.files||[])].slice(0, CK_MAX-MAP_CK_IMGS.length);
  input.value='';
  files.forEach(f=>{
    if(!f.type.startsWith('image/'))return;
    const r=new FileReader();
    r.onload=e=>{
      const im=new Image();
      im.onload=()=>{
        const w=Math.min(CK_W,im.width),h=Math.round(im.height*w/im.width);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        MAP_CK_IMGS.push(c.toDataURL('image/jpeg',CK_Q));
        renderCkPv();
      };
      im.onerror=()=>toast('图片读取失败，换一张试试','err');
      im.src=e.target.result;
    };
    r.readAsDataURL(f);
  });
}
async function submitMapCheckin(id){
  const s=spotById(id);if(!s)return;
  const btn=$('#ckSubmit');if(btn&&btn.disabled)return;
  const text=($('#ckText')&&$('#ckText').value.trim())||'这一站没有留下太多文字，但照片都记得。';
  const nick=(typeof user!=='undefined'&&user&&user.nick)||localStorage.getItem('wgo_nick')||'游客';
  if(btn){btn.disabled=true;btn.textContent='⏳ 提交中…'}
  const body={user:nick,city:cityCanon(s.city),cityName:s.city,spot:s.n,spotId:s.id,content:text,rating:s.rating,imgs:MAP_CK_IMGS.slice(0,CK_MAX),source:'map'};
  let ok=false;
  try{
    const r=await WGOAPI.postCheckin(body);
    ok=!!(r&&r.ok);
  }catch(e){ok=false}
  /* 本地也留一份：纪念册页 / 离线环境仍能看到这次打卡 */
  try{
    const albums=JSON.parse(localStorage.getItem('fmw_albums')||'[]');
    albums.unshift({id:'ck'+Date.now(),dest:s.n,city:s.city,date:new Date().toISOString().slice(0,10),
      text,mood:'😌 治愈放松',costs:[],total:0,imgs:MAP_CK_IMGS.slice(0,CK_MAX),hasVideo:false});
    localStorage.setItem('fmw_albums',JSON.stringify(albums));
  }catch(e){}
  /* 点亮：写进后端集合后重刷标点，并同步右上角计数 */
  SERVER_LIT.add(id);
  refreshLitMarkers();
  const chip=$('#litChip');if(chip)chip.textContent='✨ 已点亮 '+litSet().size+' 处';
  if(btn){btn.disabled=false;btn.textContent='✅ 已打卡'}
  toast(ok?'打卡成功，已同步到数据库 ✨':'打卡已保存到本地（后端未连接）',ok?'ok':'err');
  if(ok)setTimeout(()=>{if($('#ckSubmit'))openMapSpot(id)},700);
}
/* 首页预览截图钩子（无头浏览器用，交互中不会触发） */
window.__spotHover=id=>{const s=spotById(id);if(s){flyTo(s.rg==='cn'?cur:world,[s.lng,s.lat],2.6);openMapSpot(id)}};
window.__groundClick=()=>{try{cur&&cur.dispatchAction({type:'geoRoam',zoom:1.12})}catch(e){}};
loadECharts(ok=>{
  if(!ok){$('#mapFallback').style.display='grid';toast('地图资源加载失败，请检查网络后刷新','err');return}
  try{buildMaps()}catch(e){
    console.error('[map] 初始化失败',e);
    $('#mapFallback').style.display='grid';
    $('#mapFallback').innerHTML='<div style="grid-column:1/-1;padding:24px;text-align:center;color:#c9553f;font-size:13px;line-height:1.9">'
      +'<b>地图初始化失败</b><br>'+String(e&&e.message||e)
      +'<br><span style="color:#8a7a63;font-size:12px">请按 F12 打开控制台查看详细堆栈</span></div>'
      +'<div style="grid-column:1/-1">'+(typeof emptyArt==='function'
        ?emptyArt('这张手账地图暂时没画出来','换个城市看看，或刷新页面重试；标点数据不会丢失')
        :'')+'</div>';
    toast('地图初始化失败：'+(e&&e.message||e),'err');
    return;
  }
  /* 深度链接：map.html?spot=xxx[&zoom=3.6] 自动定位并放大到该景点
   * 行程卡片的 pin 按钮跳的就是这里（P2） */
  const sid=WGO.q('spot');
  if(sid&&spotById(sid)){
    const s=spotById(sid),c=s.rg==='cn'?cur:world;
    const z=Math.min(8,Math.max(1.2,+WGO.q('zoom')||3.4));
    if(c){$$('#mapTabs button').forEach(x=>x.classList.toggle('on',x.dataset.m===s.rg));
      $('#chinaMap').style.display=s.rg==='cn'?'block':'none';
      $('#worldMap').style.display=s.rg==='ab'?'block':'none';
      setTimeout(()=>{flyTo(c,[s.lng,s.lat],z);openMapSpot(sid)},600);
    }
  }
  if(user&&user.nick&&localStorage.getItem(seedKey)&&!localStorage.getItem('fmw_lit_toast')){
    localStorage.setItem('fmw_lit_toast','1');
    setTimeout(()=>toast('✨ 你打卡过的地方已点亮成金色，点击查看详情','ok'),1200);
  }
});
</script>
</body>
</html>
